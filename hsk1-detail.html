<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>รายละเอียดคำศัพท์ HSK 1 - Fast Learn Academy</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Prompt', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 text-gray-900 min-h-screen flex flex-col justify-between">

    <!-- Header Section -->
    <header class="bg-black text-white border-b-4 border-red-600 shadow-lg">
        <div class="max-w-4xl mx-auto px-4 py-8 text-center">
            <div class="inline-block bg-red-600 text-white text-xs font-bold px-3 py-1 rounded-full uppercase tracking-wider mb-2 shadow">
                FAST LEARN ACADEMY
            </div>
            <h1 class="text-2xl md:text-3xl font-extrabold tracking-wide">
                รายละเอียดคำศัพท์ <span class="text-yellow-400">HSK ระดับ 1</span>
            </h1>
        </div>
    </header>

    <!-- Main Content: รายละเอียด -->
    <main class="max-w-2xl mx-auto px-4 py-12 flex-grow w-full">
        <div class="bg-white rounded-3xl border-2 border-gray-100 shadow-xl p-8 md:p-12 text-center relative overflow-hidden">
            <div class="absolute top-0 left-0 w-full h-3 bg-red-600"></div>
            
            <!-- ตัวอักษรจีนหลักและพินอินคำศัพท์ -->
            <div id="wordDisplay" class="text-7xl md:text-8xl font-extrabold text-gray-900 mb-2">-</div>
            <div id="pinyinDisplay" class="text-2xl font-bold text-red-600 mb-6">-</div>

            <!-- ข้อมูลรายละเอียด -->
            <div class="bg-gray-50 rounded-2xl p-6 text-left space-y-4 mb-8 border border-gray-100">
                <div class="flex justify-between items-center border-b border-gray-200 pb-3">
                    <span class="font-semibold text-gray-500">ความหมายภาษาไทย:</span>
                    <span id="meaningDisplay" class="text-lg font-bold text-gray-800">-</span>
                </div>
                <div class="flex justify-between items-center border-b border-gray-200 pb-3">
                    <span class="font-semibold text-gray-500">ประเภทคำ:</span>
                    <span id="typeDisplay" class="font-medium text-gray-800">-</span>
                </div>
                <div class="flex justify-between items-center border-b border-gray-200 pb-3">
                    <span class="font-semibold text-gray-500">ความถี่รวมทั้งหมด:</span>
                    <span id="freqTotalDisplay" class="font-bold text-red-600 bg-red-50 px-3 py-1 rounded-full text-sm">-</span>
                </div>
                <div class="space-y-1">
                    <span class="font-semibold text-gray-500 block">ชุดข้อสอบที่พบ:</span>
                    <span id="setsFoundDisplay" class="text-sm font-medium text-gray-700 block bg-white p-3 rounded-xl border border-gray-200">-</span>
                </div>
            </div>

            <!-- ประโยคตัวอย่าง พร้อมพินอินและคำแปลภาษาไทย -->
            <div class="bg-yellow-50 border-l-4 border-yellow-400 p-6 rounded-r-xl text-left mb-8 space-y-3">
                <h3 class="text-xs font-bold text-yellow-800 uppercase tracking-wider">ประโยคตัวอย่างจากข้อสอบ (Example)</h3>
                <p id="exampleChinese" class="text-xl font-bold text-gray-900">-</p>
                <p id="examplePinyin" class="text-sm font-semibold text-red-600">-</p>
                <p id="exampleMeaning" class="text-sm font-medium text-gray-700">-</p>
            </div>

            <!-- ปุ่มย้อนกลับ -->
            <a href="hsk1.html" class="inline-block bg-black text-white px-8 py-3 rounded-full font-bold hover:bg-red-600 transition shadow-lg">
                ← กลับสู่หน้าคลังคำศัพท์ HSK 1
            </a>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-black text-white py-6 text-center text-gray-400 text-sm mt-12 border-t-2 border-red-600">
        <p>Fast Learn Academy • เซ็นทรัล โคราช ชั้น 3 Education Zone</p>
    </footer>

    <script>
        // ดึงค่าพารามิเตอร์จาก URL
        const params = new URLSearchParams(window.location.search);
        
        const word = params.get('word') || 'ไม่พบข้อมูล';
        const pinyin = params.get('pinyin') || '-';
        const meaning = params.get('meaning') || '-';
        const type = params.get('type') || '-';
        const freqTotal = (params.get('freqTotal') || '0') + ' ครั้ง';
        const setsFound = params.get('setsFound') || '-';
        const fullExample = params.get('example') || 'ไม่มีตัวอย่างประโยคในระบบ';

        document.getElementById('wordDisplay').innerText = word;
        document.getElementById('pinyinDisplay').innerText = pinyin;
        document.getElementById('meaningDisplay').innerText = meaning;
        document.getElementById('typeDisplay').innerText = type;
        document.getElementById('freqTotalDisplay').innerText = freqTotal;
        document.getElementById('setsFoundDisplay').innerText = setsFound;

        // แยกและจัดรูปแบบตัวอย่างประโยค (ภาษาจีน, พินอิน, ความหมายไทย)
        if (fullExample.includes('(') && fullExample.includes(')')) {
            const parts = fullExample.split('(');
            document.getElementById('exampleChinese').innerText = parts[0].trim();
            const translationPart = parts[1].replace(')', '').trim();
            
            if (translationPart.includes(' - ')) {
                const subParts = translationPart.split(' - ');
                document.getElementById('examplePinyin').innerText = subParts[0].trim();
                document.getElementById('exampleMeaning').innerText = "แปลไทย: " + subParts[1].trim();
            } else {
                document.getElementById('examplePinyin').innerText = translationPart;
                document.getElementById('exampleMeaning').innerText = "";
            }
        } else {
            document.getElementById('exampleChinese').innerText = fullExample;
            document.getElementById('examplePinyin').innerText = "";
            document.getElementById('exampleMeaning').innerText = "";
        }
    </script>
</body>
</html>
