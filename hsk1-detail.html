<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>รายละเอียดคำศัพท์ HSK 1 - Fast Learn Academy</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Prompt', sans-serif; }
    </style>
</head>
<body class="bg-stone-100 text-gray-900 min-h-screen flex flex-col justify-between selection:bg-red-600 selection:text-white">

    <!-- Header Section -->
    <header class="bg-black text-white border-b-4 border-red-600 shadow-lg">
        <div class="max-w-4xl mx-auto px-4 py-8 text-center">
            <div class="inline-block bg-red-600 text-white text-xs font-bold px-3 py-1 rounded-full uppercase tracking-wider mb-2 shadow">
                FAST LEARN ACADEMY
            </div>
            <h1 class="text-2xl md:text-3xl font-extrabold tracking-wide">
                รายละเอียดคำศัพท์ <span class="text-yellow-400">HSK ระดับ 1</span>
            </h1>
        </div>
    </header>

    <!-- Main Content: รายละเอียด (พร้อมปุ่มเลื่อนด้านข้าง) -->
    <main class="max-w-4xl mx-auto px-4 py-12 flex-grow w-full flex items-center justify-center relative">
        
        <!-- ปุ่มย้อนกลับด้านซ้าย -->
        <button onclick="changeWord(-1)" class="absolute left-2 md:left-4 z-10 p-3 md:p-4 bg-white hover:bg-stone-50 text-stone-700 rounded-full shadow-lg border border-stone-200 transition-all hover:scale-105 flex items-center justify-center" title="คำก่อนหน้า">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/></svg>
        </button>

        <!-- การ์ดเนื้อหาตรงกลาง -->
        <div class="w-full max-w-xl bg-white rounded-3xl border-2 border-gray-100 shadow-xl p-8 md:p-12 text-center relative overflow-hidden mx-12">
            <div class="absolute top-0 left-0 w-full h-3 bg-red-600"></div>
            
            <!-- ตัวอักษรจีนหลักและพินอินคำศัพท์ พร้อมปุ่มฟังเสียง -->
            <div id="wordDisplay" class="text-7xl md:text-8xl font-extrabold text-gray-900 mb-2">-</div>
            <div id="pinyinDisplay" class="text-2xl font-bold text-red-600 mb-4">-</div>
            <div class="mb-6">
                <button onclick="speakText(document.getElementById('wordDisplay').innerText)" class="px-4 py-2 bg-red-50 text-red-600 rounded-xl text-xs font-bold hover:bg-red-100 transition shadow-sm">
                    🔊 ฟังเสียงอ่านคำศัพท์
                </button>
            </div>

            <!-- ข้อมูลรายละเอียด -->
            <div class="bg-gray-50 rounded-2xl p-6 text-left space-y-4 mb-8 border border-gray-100">
                <div class="flex justify-between items-center border-b border-gray-200 pb-3">
                    <span class="font-semibold text-gray-500">ความหมายภาษาไทย:</span>
                    <span id="meaningDisplay" class="text-lg font-bold text-gray-800">-</span>
                </div>
                <div class="flex justify-between items-center border-b border-gray-200 pb-3">
                    <span class="font-semibold text-gray-500">ประเภทคำ:</span>
                    <span id="typeDisplay" class="font-medium text-gray-800">-</span>
                </div>
                <div class="flex justify-between items-center border-b border-gray-200 pb-3">
                    <span class="font-semibold text-gray-500">ความถี่รวมทั้งหมด:</span>
                    <span id="freqTotalDisplay" class="font-bold text-red-600 bg-red-50 px-3 py-1 rounded-full text-sm">-</span>
                </div>
                <div class="space-y-1">
                    <span class="font-semibold text-gray-500 block">ชุดข้อสอบที่พบ:</span>
                    <span id="setsFoundDisplay" class="text-sm font-medium text-gray-700 block bg-white p-3 rounded-xl border border-gray-200">-</span>
                </div>
            </div>

            <!-- ประโยคตัวอย่าง พร้อมปุ่มฟังเสียงประโยค -->
            <div class="bg-yellow-50 border-l-4 border-yellow-400 p-6 rounded-r-xl text-left mb-8 space-y-3">
                <div class="flex justify-between items-center">
                    <h3 class="text-xs font-bold text-yellow-800 uppercase tracking-wider">ประโยคตัวอย่างจากข้อสอบ (EXAMPLE)</h3>
                    <button onclick="speakText(document.getElementById('exampleChinese').innerText)" class="px-3 py-1 bg-yellow-400 text-black text-xs font-bold rounded-lg hover:bg-yellow-500 transition shadow-sm">
                        🔊 ฟังเสียงประโยค
                    </button>
                </div>
                <p id="exampleChinese" class="text-xl font-bold text-gray-900">-</p>
                <p id="examplePinyin" class="text-sm font-semibold text-red-600">-</p>
                <p id="exampleMeaning" class="text-sm font-medium text-gray-700">-</p>
            </div>

            <!-- ปุ่มกลับหน้าหลัก -->
            <div>
                <a href="hsk1.html" class="block w-full bg-black text-white py-3.5 rounded-2xl font-bold hover:bg-zinc-800 transition shadow-lg text-center text-xs">
                    ← กลับสู่หน้าคลังคำศัพท์ HSK 1
                </a>
            </div>
        </div>

        <!-- ปุ่มถัดไปด้านขวา -->
        <button onclick="changeWord(1)" class="absolute right-2 md:right-4 z-10 p-3 md:p-4 bg-white hover:bg-stone-50 text-stone-700 rounded-full shadow-lg border border-stone-200 transition-all hover:scale-105 flex items-center justify-center" title="คำถัดไป">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/></svg>
        </button>

    </main>

    <!-- Footer -->
    <footer class="bg-black text-white py-6 text-center text-gray-400 text-sm mt-12 border-t-2 border-red-600">
        <p>Fast Learn Academy • เซ็นทรัล โคราช ชั้น 3 Education Zone</p>
    </footer>

    <script>
        const hsk1FullData = [
            { id: 1, word: "我", pinyin: "wǒ", meaning: "ฉัน", type: "สรรพนาม", freqTotal: "118 ครั้ง", setsFound: "H11006, H11007, H11008, H11009, H11112", chinese: "我去商店,我想买一些水果。", pinyinEx: "Wǒ qù shāngdiàn, wǒ xiǎng mǎi yīxiē shuǐguǒ.", meanEx: "ฉันไปร้านค้า ฉันอยากซื้อผลไม้บางส่วน" },
            { id: 2, word: "你", pinyin: "nǐ", meaning: "คุณ", type: "สรรพนาม", freqTotal: "100 ครั้ง", setsFound: "H11006, H11007, H11008, H11009, H11112", chinese: "你好!", pinyinEx: "Nǐ hǎo!", meanEx: "สวัสดี!" },
            { id: 3, word: "他", pinyin: "tā", meaning: "เขา (ผู้ชาย)", type: "สรรพนาม", freqTotal: "37 ครั้ง", setsFound: "H11006, H11007, H11008, H11009, H11112", chinese: "他爸爸在哪儿工作?", pinyinEx: "Tā bàba zài nǎr gōngzuò?", meanEx: "พ่อของเขาทำงานอยู่ที่ไหน?" },
            { id: 4, word: "她", pinyin: "tā", meaning: "เขา (ผู้หญิง)", type: "สรรพนาม", freqTotal: "24 ครั้ง", setsFound: "H11006, H11007, H11008, H11009, H11112", chinese: "她下午去哪里?", pinyinEx: "Tā xiàwǔ qù nǎlǐ?", meanEx: "ช่วงบ่ายเธอไปไหน?" },
            { id: 5, word: "我们", pinyin: "wǒmen", meaning: "พวกเรา", type: "สรรพนาม", freqTotal: "16 ครั้ง", setsFound: "H11007, H11008, H11009, H11112", chinese: "我们什么时候去医院?", pinyinEx: "Wǒmen shénme shíhou qù yīyuàn?", meanEx: "พวกเราจะไปโรงพยาบาลตอนไหน?" },
            { id: 6, word: "你们", pinyin: "nǐmen", meaning: "พวกคุณ", type: "สรรพนาม", freqTotal: "9 ครั้ง", setsFound: "H11112, H11113, H11220", chinese: "喂,你们在哪儿呢?", pinyinEx: "Wèi, nǐmen zài nǎr ne?", meanEx: "ฮัลโหล พวกคุณอยู่ที่ไหนกัน?" },
            { id: 7, word: "他们", pinyin: "tāmen", meaning: "พวกเขา", type: "สรรพนาม", freqTotal: "2 ครั้ง", setsFound: "H11007, H11112", chinese: "他们都是我的同学。", pinyinEx: "Tāmen dōu shì wǒ de tóngxué.", meanEx: "พวกเขาล้วนเป็นเพื่อนร่วมชั้นของฉัน" },
            { id: 8, word: "谁", pinyin: "shéi", meaning: "ใคร", type: "สรรพนาม", freqTotal: "13 ครั้ง", setsFound: "H11006, H11008, H11112", chinese: "谁会说汉语?", pinyinEx: "Shéi huì shuō Hànyǔ?", meanEx: "ใครพูดภาษาจีนได้?" },
            { id: 9, word: "什么", pinyin: "shénme", meaning: "อะไร", type: "สรรพนาม", freqTotal: "29 ครั้ง", setsFound: "H11006, H11007, H11008, H11009", chinese: "你想买什么?", pinyinEx: "Nǐ xiǎng mǎi shénme?", meanEx: "คุณอยากซื้ออะไร?" },
            { id: 10, word: "哪里/哪儿", pinyin: "nǎli / nǎr", meaning: "ที่ไหน", type: "สรรพนาม", freqTotal: "24 ครั้ง", setsFound: "H11006, H11007, H11008, H11009", chinese: "你去哪儿?", pinyinEx: "Nǐ qù nǎr?", meanEx: "คุณไปไหน?" }
        ];

        function speakText(text) {
            if ('speechSynthesis' in window) {
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'zh-CN';
                utterance.rate = 0.9;
                window.speechSynthesis.speak(utterance);
            } else {
                alert("เบราว์เซอร์ของคุณไม่รองรับการออกเสียง");
            }
        }

        const urlParams = new URLSearchParams(window.location.search);
        let currentWordIndex = 0;

        const targetWord = urlParams.get('word');
        if (targetWord) {
            const foundIdx = hsk1FullData.findIndex(item => item.word === targetWord);
            if (foundIdx !== -1) currentWordIndex = foundIdx;
        }

        function displayCurrentWord() {
            const item = hsk1FullData[currentWordIndex];
            document.getElementById('wordDisplay').innerText = item.word;
            document.getElementById('pinyinDisplay').innerText = item.pinyin;
            document.getElementById('meaningDisplay').innerText = item.meaning;
            document.getElementById('typeDisplay').innerText = item.type;
            document.getElementById('freqTotalDisplay').innerText = item.freqTotal + ' ครั้ง';
            document.getElementById('setsFoundDisplay').innerText = item.setsFound;
            
            document.getElementById('exampleChinese').innerText = item.chinese || '暂ไม่มีตัวอย่างประโยคในระบบ';
            document.getElementById('examplePinyin').innerText = item.pinyinEx || '';
            document.getElementById('exampleMeaning').innerText = item.meanEx ? `แปลไทย: ${item.meanEx}` : '';
        }

        function changeWord(direction) {
            currentWordIndex += direction;
            if (currentWordIndex < 0) {
                currentWordIndex = hsk1FullData.length - 1;
            } else if (currentWordIndex >= hsk1FullData.length) {
                currentWordIndex = 0;
            }
            displayCurrentWord();
        }

        displayCurrentWord();
    </script>
</body>
</html>
