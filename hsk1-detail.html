<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>รายละเอียดคำศัพท์ HSK 1 - Fast Learn Academy</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Prompt', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 text-gray-900 min-h-screen flex flex-col justify-between">

    <!-- Header Section -->
    <header class="bg-black text-white border-b-4 border-red-600 shadow-lg">
        <div class="max-w-4xl mx-auto px-4 py-8 text-center">
            <div class="inline-block bg-red-600 text-white text-xs font-bold px-3 py-1 rounded-full uppercase tracking-wider mb-2 shadow">
                FAST LEARN ACADEMY
            </div>
            <h1 class="text-2xl md:text-3xl font-extrabold tracking-wide">
                รายละเอียดคำศัพท์ <span class="text-yellow-400">HSK ระดับ 1</span>
            </h1>
        </div>
    </header>

    <!-- Main Content: รายละเอียด -->
    <main class="max-w-2xl mx-auto px-4 py-12 flex-grow w-full">
        <div class="bg-white rounded-3xl border-2 border-gray-100 shadow-xl p-8 md:p-12 text-center relative overflow-hidden">
            <div class="absolute top-0 left-0 w-full h-3 bg-red-600"></div>
            
            <!-- ตัวอักษรจีนหลัก -->
            <div id="wordDisplay" class="text-7xl md:text-8xl font-extrabold text-gray-900 mb-2">-</div>
            <div id="pinyinDisplay" class="text-2xl font-bold text-red-600 mb-6">-</div>

            <!-- ข้อมูลรายละเอียด -->
            <div class="bg-gray-50 rounded-2xl p-6 text-left space-y-4 mb-8 border border-gray-100">
                <div class="flex justify-between items-center border-b border-gray-200 pb-3">
                    <span class="font-semibold text-gray-500">ความหมาย:</span>
                    <span id="meaningDisplay" class="text-lg font-bold text-gray-800">-</span>
                </div>
                <div class="flex justify-between items-center border-b border-gray-200 pb-3">
                    <span class="font-semibold text-gray-500">ประเภทคำ:</span>
                    <span id="typeDisplay" class="font-medium text-gray-800">-</span>
                </div>
                <div class="flex justify-between items-center">
                    <span class="font-semibold text-gray-500">ความถี่จากข้อสอบจริง:</span>
                    <span id="freqDisplay" class="font-bold text-yellow-600 bg-yellow-50 px-3 py-1 rounded-full text-sm">-</span>
                </div>
            </div>

            <!-- ประโยคตัวอย่าง พร้อมพินอินและคำแปล -->
            <div class="bg-yellow-50 border-l-4 border-yellow-400 p-5 rounded-r-xl text-left mb-8 space-y-2">
                <h3 class="text-xs font-bold text-yellow-800 uppercase tracking-wider">ประโยคตัวอย่างจากข้อสอบ (Example)</h3>
                <p id="exampleDisplay" class="text-xl font-bold text-gray-900">-</p>
                <p id="examplePinyin" class="text-sm font-semibold text-red-600">-</p>
                <p id="exampleMeaning" class="text-sm font-medium text-gray-700">-</p>
            </div>

            <!-- ปุ่มย้อนกลับ -->
            <a href="hsk1.html" class="inline-block bg-black text-white px-8 py-3 rounded-full font-bold hover:bg-red-600 transition shadow-lg">
                ← กลับสู่หน้าคลังคำศัพท์ HSK 1
            </a>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-black text-white py-6 text-center text-gray-400 text-sm mt-12 border-t-2 border-red-600">
        <p>Fast Learn Academy • เซ็นทรัล โคราช ชั้น 3 Education Zone</p>
    </footer>

    <script>
        // ฟังก์ชันช่วยจับคู่พินอินและคำแปลภาษาไทยเบื้องต้นสำหรับประโยคตัวอย่าง
        const sentenceTranslationMap = {
            "我去商店,我想买一些水果。": {
                pinyin: "Wǒ qù shāngdiàn, wǒ xiǎng mǎi yìxiē shuǐguǒ.",
                meaning: "ฉันไปร้านค้า ฉันอยากซื้อผลไม้บางส่วน"
            },
            "你好!": {
                pinyin: "Nǐ hǎo!",
                meaning: "สวัสดี!"
            },
            "他是坐火车来的。": {
                pinyin: "Tā shì zuò huǒchē lái de.",
                meaning: "เขาเดินทางมาโดยรถไฟ"
            },
            "她下午去哪里?": {
                pinyin: "Tā xiàwǔ qù nǎlǐ?",
                meaning: "ช่วงบ่ายเธอไปที่ไหน?"
            },
            "我们什么时候去医院?": {
                pinyin: "Wǒmen shénme shíhou qù yīyuàn?",
                meaning: "พวกเราจะไปโรงพยาบาลตอนไหน?"
            },
            "喂,你们在哪儿呢?": {
                pinyin: "Wèi, nǐmen zài nǎr ne?",
                meaning: "ฮัลโหล, พวกคุณอยู่ที่ไหนกัน?"
            },
            "他们都是我的同学。": {
                pinyin: "Tāmen dōu shì wǒ de tóngxué.",
                meaning: "พวกเขาล้วนเป็นเพื่อนร่วมชั้นของฉัน"
            },
            "谁会说汉语?": {
                pinyin: "Shéi huì shuō Hànyǔ?",
                meaning: "ใครสามารถพูดภาษาจีนได้?"
            },
            "你想买什么?": {
                pinyin: "Nǐ xiǎng mǎi shénme?",
                meaning: "คุณอยากซื้ออะไร?"
            },
            "他爸爸在哪儿工作?": {
                pinyin: "Tā bàba zài nǎr gōngzuò?",
                meaning: "คุณพ่อของเขาทำงานอยู่ที่ไหน?"
            },
            "明天你怎么去医院?": {
                pinyin: "Míngtiān nǐ zěnme qù yīyuàn?",
                meaning: "พรุ่งนี้คุณจะไปโรงพยาบาลอย่างไร?"
            },
            "怎么样? 漂亮吗?": {
                pinyin: "Zěnmeyàng? Piàoliang ma?",
                meaning: "เป็นอย่างไรบ้าง? สวยไหม?"
            },
            "你家的电话是多少呢?": {
                pinyin: "Nǐ jiā de diànhuà shì duōshao ne?",
                meaning: "เบอร์โทรศัพท์บ้านของคุณคือเบอร์อะไรล่ะ?"
            },
            "你今年多大了?": {
                pinyin: "Nǐ jīnnián duō dà le?",
                meaning: "ปีนี้คุณอายุเท่าไหร่แล้ว?"
            },
            "很少。": {
                pinyin: "Hěn shǎo.",
                meaning: "น้อยมาก"
            },
            "我很喜欢这本书。": {
                pinyin: "Wǒ hěn xǐhuan zhè běn shū.",
                meaning: "ฉันชอบหนังสือเล่มนี้มาก"
            },
            "我朋友在前面那个商店。": {
                pinyin: "Wǒ péngyou zài qiánmiàn nà gè shāngdiàn.",
                meaning: "เพื่อนของฉันอยู่ที่ร้านค้าด้านหน้านั้น"
            },
            "她是我大学同学。": {
                pinyin: "Tā shì wǒ dàxué tóngxué.",
                meaning: "เธอคือเพื่อนร่วมมหาวิทยาลัยของฉัน"
            },
            "这儿有人了。": {
                pinyin: "Zhèr yǒu rén le.",
                meaning: "ที่นี่มีคนนั่ง/มีคนอยู่แล้ว"
            },
            "我在家看电视了。": {
                pinyin: "Wǒ zài jiā kàn diànshì le.",
                meaning: "ฉันดูโทรทัศน์อยู่ที่บ้านแล้ว"
            },
            "我现在不想听你说话。": {
                pinyin: "Wǒ xiànzài bù xiǎng tīng nǐ shuōhuà.",
                meaning: "ตอนนี้ฉันไม่อยากฟังคุณพูด"
            },
            "你能听见我说话吗?": {
                pinyin: "Nǐ néng tīngjiàn wǒ shuōhuà ma?",
                meaning: "คุณได้ยินที่ฉันพูดไหม?"
            },
            "谁会说汉语?": {
                pinyin: "Shéi huì shuō Hànyǔ?",
                meaning: "ใครพูดภาษาจีนได้"
            },
            "这几个字怎么读?": {
                pinyin: "Zhè jǐ gè zì zěnme dú?",
                meaning: "ตัวอักษรเหล่านี้อ่านอย่างไร?"
            },
            "这个字我不会写。": {
                pinyin: "Zhè gè zì wǒ bú huì xiě.",
                meaning: "ตัวอักษรนี้ฉันเขียนไม่เป็น"
            },
            "你什么时候回中国?": {
                pinyin: "Nǐ shénme shíhou huí Zhōngguó?",
                meaning: "คุณจะกลับประเทศจีนตอนไหน?"
            },
            "坐出租车。": {
                pinyin: "Zuò chūzūchē.",
                meaning: "นั่งรถแท็กซี่"
            },
            "我妈妈喜欢吃中国菜。": {
                pinyin: "Wǒ māmā xǐhuan chī Zhōngguó cài.",
                meaning: "คุณแม่ของฉันชอบกินอาหารจีน"
            },
            "你喝水吗?": {
                pinyin: "Nǐ hē shuǐ ma?",
                meaning: "คุณดื่มน้ำไหม?"
            },
            "睡觉。": {
                pinyin: "Shuìjiào.",
                meaning: "นอนหลับ"
            },
            "打电话。": {
                pinyin: "Dǎ diànhuà.",
                meaning: "โทรศัพท์"
            },
            "开车。": {
                pinyin: "Kāi chē.",
                meaning: "ขับรถ"
            },
            "你叫什么名字?": {
                pinyin: "Nǐ jiào shénme míngzi?",
                meaning: "คุณชื่ออะไร?"
            },
            "很高兴认识你。": {
                pinyin: "Hěn gāoxìng rènshi nǐ.",
                meaning: "ยินดีที่ได้รู้จักคุณ"
            },
            "天气很冷。": {
                pinyin: "Tiānqì hěn lěng.",
                meaning: "อากาศหนาวมาก"
            },
            "很热。": {
                pinyin: "Hěn rè.",
                meaning: "ร้อนมาก"
            },
            "太冷。": {
                pinyin: " Tài lěng.",
                meaning: "หนาวเกินไป"
            },
            "我没去看电影。": {
                pinyin: "Wǒ méi qù kàn diànyǐng.",
                meaning: "ฉันไม่ได้ไปดูภาพยนตร์"
            },
            "喝点儿水吧。": {
                pinyin: "Hē diǎnr shuǐ ba.",
                meaning: "ดื่มน้ำหน่อยเถอะ"
            }
        };

        // ดึงค่าพารามิเตอร์จาก URL
        const params = new URLSearchParams(window.location.search);
        const word = params.get('word') || 'ไม่พบข้อมูล';
        const pinyin = params.get('pinyin') || '-';
        const meaning = params.get('meaning') || '-';
        const type = params.get('type') || '-';
        const freq = params.get('freq') || '-';
        let example = params.get('example') || 'ไม่มีตัวอย่างประโยคในระบบ';

        document.getElementById('wordDisplay').innerText = word;
        document.getElementById('pinyinDisplay').innerText = pinyin;
        document.getElementById('meaningDisplay').innerText = meaning;
        document.getElementById('typeDisplay').innerText = type;
        document.getElementById('freqDisplay').innerText = freq;
        document.getElementById('exampleDisplay').innerText = example;

        // ค้นหาพินอินและคำแปลของประโยคตัวอย่าง ถ้ามีในฐานข้อมูล
        if (sentenceTranslationMap[example]) {
            document.getElementById('examplePinyin').innerText = sentenceTranslationMap[example].pinyin;
            document.getElementById('exampleMeaning').innerText = "แปลไทย: " + sentenceTranslationMap[example].meaning;
        } else {
            document.getElementById('examplePinyin').innerText = "-";
            document.getElementById('exampleMeaning').innerText = "แปลไทย: (กำลังอัปเดตข้อมูลแปลประโยค)";
        }
    </script>
</body>
</html>
