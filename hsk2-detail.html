<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>รายละเอียดคำศัพท์ HSK 2 - Fast Learn Academy</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Prompt', sans-serif; }
    </style>
</head>
<body class="bg-stone-100 text-gray-900 min-h-screen flex flex-col justify-between selection:bg-red-600 selection:text-white">

    <!-- Header Section -->
    <header class="bg-black text-white border-b-4 border-red-600 shadow-lg">
        <div class="max-w-4xl mx-auto px-4 py-8 text-center">
            <div class="inline-block bg-red-600 text-white text-xs font-bold px-3 py-1 rounded-full uppercase tracking-wider mb-2 shadow">
                FAST LEARN ACADEMY
            </div>
            <h1 class="text-2xl md:text-3xl font-extrabold tracking-wide">
                รายละเอียดคำศัพท์ <span class="text-yellow-400">HSK ระดับ 2</span>
            </h1>
        </div>
    </header>

    <!-- Main Content: รายละเอียด (พร้อมปุ่มเลื่อนด้านข้าง) -->
    <main class="max-w-4xl mx-auto px-4 py-12 flex-grow w-full flex items-center justify-center relative">
        
        <!-- ปุ่มย้อนกลับด้านซ้าย -->
        <button onclick="changeWord(-1)" class="absolute left-2 md:left-4 z-10 p-3 md:p-4 bg-white hover:bg-stone-50 text-stone-700 rounded-full shadow-lg border border-stone-200 transition-all hover:scale-105 flex items-center justify-center" title="คำก่อนหน้า">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/></svg>
        </button>

        <!-- การ์ดเนื้อหาตรงกลาง -->
        <div class="w-full max-w-xl bg-white rounded-3xl border-2 border-gray-100 shadow-xl p-8 md:p-12 text-center relative overflow-hidden mx-12">
            <div class="absolute top-0 left-0 w-full h-3 bg-red-600"></div>
            
            <!-- ตัวอักษรจีนหลักและพินอินคำศัพท์ พร้อมปุ่มฟังเสียง -->
            <div id="wordDisplay" class="text-7xl md:text-8xl font-extrabold text-gray-900 mb-2">-</div>
            <div id="pinyinDisplay" class="text-2xl font-bold text-red-600 mb-4">-</div>
            <div class="mb-6">
                <button onclick="speakText(document.getElementById('wordDisplay').innerText)" class="px-4 py-2 bg-red-50 text-red-600 rounded-xl text-xs font-bold hover:bg-red-100 transition shadow-sm">
                    🔊 ฟังเสียงอ่านคำศัพท์
                </button>
            </div>

            <!-- ข้อมูลรายละเอียด -->
            <div class="bg-white rounded-2xl p-6 text-left space-y-4 mb-8 border border-gray-100 shadow-sm">
                <div class="flex justify-between items-center border-b border-gray-100 pb-3">
                    <span class="font-semibold text-gray-500">ความหมายภาษาไทย:</span>
                    <span id="meaningDisplay" class="text-lg font-bold text-gray-800">-</span>
                </div>
                <div class="flex justify-between items-center border-b border-gray-100 pb-3">
                    <span class="font-semibold text-gray-500">ประเภทคำ:</span>
                    <span id="typeDisplay" class="font-medium text-gray-800">-</span>
                </div>
                <div class="flex justify-between items-center border-b border-gray-100 pb-3">
                    <span class="font-semibold text-gray-500">สถิติการออกข้อสอบ:</span>
                    <span id="freqTotalDisplay" class="font-bold text-red-600 bg-red-50 border border-red-100 px-3 py-1 rounded-full text-sm">-</span>
                </div>
                <div class="space-y-1">
                    <span class="font-semibold text-gray-500 block">เลขชุดข้อสอบที่พบซ้ำ:</span>
                    <span id="setsFoundDisplay" class="text-sm font-medium text-gray-700 block bg-gray-50 p-3 rounded-xl border border-gray-200">-</span>
                </div>
            </div>

            <!-- ประโยคตัวอย่าง พร้อมปุ่มฟังเสียงประโยค -->
            <div class="bg-yellow-50 border-l-4 border-yellow-400 p-6 rounded-r-xl text-left mb-8 space-y-3">
                <div class="flex justify-between items-center">
                    <h3 class="text-xs font-bold text-yellow-800 uppercase tracking-wider">ประโยคตัวอย่างจากข้อสอบ (EXAMPLE)</h3>
                    <button onclick="speakText(document.getElementById('exampleChinese').innerText)" class="px-3 py-1 bg-yellow-400 text-black text-xs font-bold rounded-lg hover:bg-yellow-500 transition shadow-sm">
                        🔊 ฟังเสียงประโยค
                    </button>
                </div>
                <p id="exampleChinese" class="text-xl font-bold text-gray-900">-</p>
                <p id="examplePinyin" class="text-sm font-semibold text-red-600">-</p>
                <p id="exampleMeaning" class="text-sm font-medium text-gray-700">-</p>
            </div>

            <!-- ปุ่มกลับหน้าหลัก -->
            <div>
                <a href="hsk2.html" class="block w-full bg-black text-white py-3.5 rounded-2xl font-bold hover:bg-zinc-800 transition shadow-lg text-center text-xs">
                    ← กลับสู่หน้าคลังคำศัพท์ HSK 2
                </a>
            </div>
        </div>

        <!-- ปุ่มถัดไปด้านขวา -->
        <button onclick="changeWord(1)" class="absolute right-2 md:right-4 z-10 p-3 md:p-4 bg-white hover:bg-stone-50 text-stone-700 rounded-full shadow-lg border border-stone-200 transition-all hover:scale-105 flex items-center justify-center" title="คำถัดไป">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/></svg>
        </button>

    </main>

    <!-- Footer -->
    <footer class="bg-black text-white py-6 text-center text-gray-400 text-sm mt-12 border-t-2 border-red-600">
        <p>Fast Learn Academy • เซ็นทรัล โคราช ชั้น 3 Education Zone</p>
    </footer>

    <script>
        const hsk2FullData = [
            { id: 1, word: "分", pinyin: "fēn", meaning: "นาที", type: "คำนาม/คำกริยา", freqTotal: "เจอ 175 ครั้ง", setsFound: "H21331, H21332, H21333, H21334, H21335", chinese: "他们已经游了20分钟了。", pinyinEx: "Tāmen yǐjīng yóule 20 fēnzhōng le.", meanEx: "พวกเขาว่ายน้ำไปได้ 20 นาทีแล้ว" },
            { id: 2, word: "个", pinyin: "gè", meaning: "คน / อัน", type: "ลักษณนาม", freqTotal: "เจอ 110 ครั้ง", setsFound: "H21331, H21332, H21333, H21334, H21335", chinese: "小王,这里有几个杯子?", pinyinEx: "Xiǎo Wáng, zhèli yǒu jǐ ge bēizi?", meanEx: "เสี่ยวหวัง ที่นี่มีแก้วกี่ใบ?" },
            { id: 3, word: "在", pinyin: "zài", meaning: "อยู่ที่ / กำลัง", type: "คำบุพบท", freqTotal: "เจอ 79 ครั้ง", setsFound: "H21331, H21332, H21333, H21334, H21335", chinese: "他正在北京旅游。", pinyinEx: "Tā zhèngzài Běijīng lùyóu.", meanEx: "เขากำลังท่องเที่ยวอยู่ที่ปักกิ่ง" },
            { id: 4, word: "很", pinyin: "hěn", meaning: "มาก", type: "คำวิเศษณ์", freqTotal: "เจอ 60 ครั้ง", setsFound: "H21331, H21332, H21333, H21334, H21335", chinese: "这儿的羊肉很好吃。", pinyinEx: "Zhèr de yángròu hěn hǎochī.", meanEx: "เนื้อแกะที่นี่อร่อยมาก" },
            { id: 5, word: "看", pinyin: "kàn", meaning: "ดู / มอง / อ่าน", type: "คำกริยา", freqTotal: "เจอ 57 ครั้ง", setsFound: "H21331, H21332, H21333, H21334, H21335", chinese: "你知道吗?这是我第一次看见下雪。", pinyinEx: "Nǐ zhīdào ma? Zhè shì wǒ dì yī cì kànjiàn xiàxuě.", meanEx: "เธอรู้ไหม? นี่คือครั้งแรกที่ฉันเห็นหิมะตก" },
            { id: 6, word: "钟", pinyin: "zhōng", meaning: "นาฬิกา / โมง", type: "คำนาม", freqTotal: "เจอ 55 ครั้ง", setsFound: "H21331, H21332, H21333, H21334, H21335", chinese: "10分钟后到。", pinyinEx: "10 fēnzhōng hòu dào.", meanEx: "10 นาทีทีหลังถึง" },
            { id: 7, word: "点", pinyin: "diǎn", meaning: "โมง / จุด", type: "คำนาม/คำกริยา", freqTotal: "เจอ 46 ครั้ง", setsFound: "H21331, H21332, H21333, H21334, H21335", chinese: "现在是11点30分。", pinyinEx: "Xiànzài shì 11 diǎn 30 fēn.", meanEx: "ตอนนี้คือเวลา 11 โมง 30 นาที" },
            { id: 8, word: "听", pinyin: "tīng", meaning: "ฟัง", type: "คำกริยา", freqTotal: "เจอ 39 ครั้ง", setsFound: "H21331, H21332, H21333, H21334, H21335", chinese: "弟弟在听歌,他听不见你说话。", pinyinEx: "Dìdi zài tīng gē, tā tīngbújiàn nǐ shuōhuà.", meanEx: "น้องชายกำลังฟังเพลงอยู่ เขาไม่ได้ยินที่คุณพูด" },
            { id: 9, word: "写", pinyin: "xiě", meaning: "เขียน", type: "คำกริยา", freqTotal: "เจอ 39 ครั้ง", setsFound: "H21331, H21332, H21333, H21334, H21335", chinese: "请在这儿写您的名字。", pinyinEx: "Qǐng zài zhèr xiě nín de míngzi.", meanEx: "โปรดเขียนชื่อของคุณตรงนี้" },
            { id: 10, word: "问", pinyin: "wèn", meaning: "ถาม", type: "คำกริยา", freqTotal: "เจอ 38 ครั้ง", setsFound: "H21331, H21332, H21333, H21334, H21335", chinese: "你姐姐呢?我想问她几个问题。", pinyinEx: "Nǐ jiějie ne? Wǒ xiǎng wèn tā jǐ ge wèntí.", meanEx: "พี่สาวคุณล่ะ? ฉันอยากถามปัญหาเขาสักสองสามข้อ" }
        ];

        function speakText(text) {
            if ('speechSynthesis' in window) {
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'zh-CN';
                utterance.rate = 0.9;
                window.speechSynthesis.speak(utterance);
            } else {
                alert("เบราว์เซอร์ของคุณไม่รองรับการออกเสียง");
            }
        }

        const urlParams = new URLSearchParams(window.location.search);
        let currentWordIndex = 0;

        const targetWord = urlParams.get('word');
        if (targetWord) {
            const foundIdx = hsk2FullData.findIndex(item => item.word === targetWord);
            if (foundIdx !== -1) currentWordIndex = foundIdx;
        }

        function displayCurrentWord() {
            const item = hsk2FullData[currentWordIndex];
            document.getElementById('wordDisplay').innerText = item.word;
            document.getElementById('pinyinDisplay').innerText = item.pinyin;
            document.getElementById('meaningDisplay').innerText = item.meaning;
            document.getElementById('typeDisplay').innerText = item.type;
            document.getElementById('freqTotalDisplay').innerText = item.freqTotal;
            document.getElementById('setsFoundDisplay').innerText = item.setsFound;
            
            document.getElementById('exampleChinese').innerText = item.chinese || '暂ไม่มีตัวอย่างประโยคในระบบ';
            document.getElementById('examplePinyin').innerText = item.pinyinEx || '';
            document.getElementById('exampleMeaning').innerText = item.meanEx ? `แปลไทย: ${item.meanEx}` : '';
        }

        function changeWord(direction) {
            currentWordIndex += direction;
            if (currentWordIndex < 0) {
                currentWordIndex = hsk2FullData.length - 1;
            } else if (currentWordIndex >= hsk2FullData.length) {
                currentWordIndex = 0;
            }
            displayCurrentWord();
        }

        displayCurrentWord();
    </script>
</body>
</html>
