            { id: 45, word: "次", pinyin: "cì", meaning: "ครั้ง", type: "ลักษณนาม", freqTotal: 14, setsFound: "H21331, H21332, H21333, H21335, H21555C, H21555D", example: "这是我第一次看见下雪。(Zhè shì wǒ dì yī cì kànjiàn xiàxuě. - นี่คือครั้งแรกที่ฉันเห็นหิมะตก)" },

            { id: 79, word: "机场", pinyin: "jīchǎng", meaning: "สนามบิน", type: "คำนาม", freqTotal: 8, setsFound: "H21331, H21332, H21333, H21334, H21335, H21555C", example: "王先生住的宾馆离机场不远。(Wáng xiānsheng zhù de bīnguǎn lí jīchǎng bù yuǎn. - โรงแรมที่คุณหวังพักอยู่ไม่ไกลจากสนามบิน)" },

            { id: 95, word: "离", pinyin: "lí", meaning: "ห่างจาก", type: "คำบุพบท", freqTotal: 7, setsFound: "H21331, H21332, H21333, H21334, H21335", example: "我家就在学校旁边。(Wǒ jiā jiù zài xuéxiào pángbiàn. - บ้านฉันอยู่ข้างโรงเรียน)" },

            { id: 111, word: "丈夫", pinyin: "zhàngfu", meaning: "สามี", type: "คำนาม", freqTotal: 7, setsFound: "H21331, H21332, H21333, H21335, H21555C, H21555D", example: "我和我丈夫20年前去那儿。(Wǒ hé wǒ zhàngfu 20 nián qián qù nàr. - ฉันกับสามีไปที่นั่นเมื่อ 20 ปีที่แล้ว)" },

            { id: 118, word: "介绍", pinyin: "jièshào", meaning: "แนะนำ", type: "คำกริยา", freqTotal: 6, setsFound: "H21331, H21332, H21333, H21334", example: "给你介绍一下,这是我妻子。(Gěi nǐ jièshào yíxià, zhè shì wǒ qīzi. - แนะนำให้รู้จักหน่อย นี่คือภรรยาของฉัน)" },
            { id: 119, word: "穿", pinyin: "chuān", meaning: "สวมใส่", type: "คำกริยา", freqTotal: 6, setsFound: "H21332, H21334, H21335, H215558, H21555C", example: "你的衣服还没穿好呢。(Nǐ de yīfu hái méi chuānhǎo ne. - เสื้อผ้าของคุณยังสวมใส่ไม่เรียบร้อยเลย)" },
            { id: 120, word: "咖啡", pinyin: "kāfēi", meaning: "กาแฟ", type: "คำนาม", freqTotal: 6, setsFound: "H21331", example: "服务员,请给我一杯咖啡。(Fúwùyuán, qǐng gěi wǒ yì bēi kāfēi. - พนักงานเสิร์ฟ กรุณาให้กาแฟฉันหนึ่งแก้ว)" },
            { id: 121, word: "米饭", pinyin: "mǐfàn", meaning: "ข้าวสวย", type: "คำนาม", freqTotal: 6, setsFound: "H21331, H21332, H21333, H21334, H21335, H21555D", example: "米饭做好了,快来吃饭吧。(Mǐfàn zuòhǎo le, kuài lái chī fàn ba. - ข้าวทำเสร็จแล้ว รีบมาทานข้าวกันเถอะ)" },
            { id: 122, word: "牛奶", pinyin: "niúnǎi", meaning: "นมวัว", type: "คำนาม", freqTotal: 6, setsFound: "H21331, H21334, H21335, H21555", example: "她喝完牛奶就睡觉了。(Tā hēwán niúnǎi jiù shuìjiào le. - เธอ ดื่มนมเสร็จก็เข้านอนเลย)" },
            { id: 123, word: "电话", pinyin: "diànhuà", meaning: "โทรศัพท์ / เบอร์โทร", type: "คำนาม", freqTotal: 6, setsFound: "H21331, H21335, H21555C, H21555D", example: "我已经帮你打电话问了。(Wǒ yǐjīng bāng nǐ dǎ diànhuà wèn le. - ฉันช่วยคุณโทรศัพท์ไปถามแล้ว)" },
            { id: 124, word: "阴", pinyin: "yīn", meaning: "ครึ้ม (เมฆมาก)", type: "คำคุณศัพท์", freqTotal: 6, setsFound: "H21331, H21334, H21335, H215558, H21555C", example: "天阴了。(Tiān yīn le. - ท้องฟ้าครึ้มแล้ว)" },

            { id: 126, word: "妹妹", pinyin: "mèimei", meaning: "น้องสาว", type: "คำนาม", freqTotal: 6, setsFound: "H21331, H21333, H21334, H215558, H21555C", example: "我妹妹明天有考试。(Wǒ mèimei míngtiān yǒu kǎoshì. - น้องสาวฉันพรุ่งนี้มีสอบ)" },

            { id: 128, word: "路", pinyin: "lù", meaning: "ถนน / ทาง", type: "คำนาม", freqTotal: 5, setsFound: "H21331, H21332, H21334, H21335", example: "他不知道去火车站的路。(Tā bù zhīdào qù huǒchēzhàn de lù. - เขาไม่รู้เส้นทางไปสถานีรถไฟ)" },

            { id: 130, word: "后面", pinyin: "hòumiàn", meaning: "ข้างหลัง", type: "คำนาม", freqTotal: 5, setsFound: "H21331, H21335, H21555C, H21555D", example: "左边的是哥哥,右边这个是弟弟。(Zuǒbian shì gēge, yòubian zhège shì dìdi. - ด้านซ้ายคือพี่ชาย ด้านขวานี้คือน้องชาย)" },
            { id: 131, word: "生病", pinyin: "shēngbìng", meaning: "ป่วย", type: "คำกริยา", freqTotal: 5, setsFound: "H21331, H21333, H21334, H21335", example: "我昨天因为生病了,所以没来上课。(Wǒ zuótiān yīnwèi shēngbìng le, suǒyǐ méi lái shàngkè. - เมื่อวานนี้ฉันเพราะว่าป่วย จึงไม่ได้มาเข้าเรียน)" },
            { id: 132, word: "休息", pinyin: "xiūxi", meaning: "พักผ่อน", type: "คำกริยา", freqTotal: 5, setsFound: "H21331, H21332, H21333, H21334, H21335", example: "来,喝杯咖啡,休息一下。(Lái, hē bēi kāfēi, xiūxi yīxià. - มา ดื่มกาแฟสักแก้ว พักผ่อนสักหน่อย)" },

        const grid = document.getElementById('vocabGrid');

        function renderVocab(data) {
            grid.innerHTML = '';
            data.forEach((item) => {
                const card = document.createElement('div');
                card.className = "bg-white p-6 rounded-2xl border-2 border-gray-100 shadow-md hover:border-red-500 hover:shadow-xl transition-all duration-300 flex flex-col justify-between cursor-pointer group";
                
                card.onclick = () => {
                    window.location.href = `hsk2-detail.html?word=${encodeURIComponent(item.word)}&pinyin=${encodeURIComponent(item.pinyin)}&meaning=${encodeURIComponent(item.meaning)}&type=${encodeURIComponent(item.type)}&freqTotal=${encodeURIComponent(item.freqTotal)}&setsFound=${encodeURIComponent(item.setsFound)}&example=${encodeURIComponent(item.example)}`;
                };

                card.innerHTML = `
                    <div>
                        <div class="flex justify-between items-center mb-3">
                            <span class="text-xs font-bold px-3 py-1 bg-red-100 text-red-700 rounded-full">${item.type}</span>
                            <span class="text-xs font-bold px-3 py-1 bg-yellow-100 text-yellow-800 rounded-full">ความถี่รวม: ${item.freqTotal} ครั้ง</span>
                        </div>
                        <div class="text-4xl font-extrabold text-gray-800 group-hover:text-red-600 transition-colors mb-1">${item.word}</div>
                        <div class="text-lg font-semibold text-red-600 mb-2">${item.pinyin}</div>
                        <p class="text-gray-600 text-sm line-clamp-1">${item.meaning}</p>
                    </div>
                    <div class="mt-4 pt-3 border-t border-gray-100 text-xs text-gray-400 group-hover:text-red-600 font-bold flex items-center justify-between transition-colors">
                        <span>ดูสถิติและตัวอย่างประโยค</span>
                        <span>→</span>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function filterVocab() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = hsk2Data.filter(item => 
                item.word.toLowerCase().includes(query) || 
                item.pinyin.toLowerCase().includes(query) || 
                item.meaning.toLowerCase().includes(query)
            );
            renderVocab(filtered);
        }

        renderVocab(hsk2Data);
