        const word = params.get('word') || 'ไม่พบข้อมูล';
        const pinyin = params.get('pinyin') || '-';
        const meaning = params.get('meaning') || '-';
        const type = params.get('type') || '-';
        
        // รองรับทั้งพารามิเตอร์แบบ freqTotal และคำนวณจากข้อมูลสำรอง
        let freqTotal = params.get('freqTotal');
        const setsFound = params.get('setsFound') || 'H31001, H31003, H31004';

        if (!freqTotal) {
            const setArr = setsFound ? setsFound.split(',').filter(s => s.trim()) : [];
            freqTotal = setArr.length > 0 ? `ซ้ำใน ${setArr.length} ชุดข้อสอบ` : 'พบในข้อสอบ';
        }

        document.getElementById('meaningDisplay').innerText = meaning;

        document.getElementById('freqTotalDisplay').innerText = freqTotal;
        document.getElementById('setsFoundDisplay').innerText = setsFound;

        if (exampleDatabaseHSK3[word]) {
            document.getElementById('exampleChinese').innerText = exampleDatabaseHSK3[word].chinese;
            document.getElementById('examplePinyin').innerText = exampleDatabaseHSK3[word].pinyin;
            document.getElementById('exampleMeaning').innerText = exampleDatabaseHSK3[word].meaning;
