<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>รายละเอียดคำศัพท์ HSK 5 - Fast Learn Academy</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Prompt', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 text-gray-900 min-h-screen flex flex-col justify-between">

    <!-- Header Section -->
    <header class="bg-black text-white border-b-4 border-red-600 shadow-lg">
        <div class="max-w-4xl mx-auto px-4 py-8 text-center">
            <div class="inline-block bg-red-600 text-white text-xs font-bold px-3 py-1 rounded-full uppercase tracking-wider mb-2 shadow">
                FAST LEARN ACADEMY
            </div>
            <h1 class="text-2xl md:text-3xl font-extrabold tracking-wide">
                รายละเอียดคำศัพท์ <span class="text-yellow-400">HSK ระดับ 5</span>
            </h1>
        </div>
    </header>

    <!-- Main Content: รายละเอียดแบบแพทเทอร์นตัวอย่าง -->
    <main class="max-w-xl mx-auto px-4 py-12 flex-grow w-full">
        <div class="bg-white rounded-3xl border-2 border-gray-100 shadow-xl p-8 md:p-12 text-center relative overflow-hidden">
            <div class="absolute top-0 left-0 w-full h-3 bg-red-600"></div>
            
            <!-- ตัวอักษรจีนหลัก และพินอินคำศัพท์ -->
            <div id="wordDisplay" class="text-7xl md:text-8xl font-extrabold text-gray-900 mb-2">-</div>
            <div id="pinyinDisplay" class="text-2xl font-bold text-red-600 mb-8">-</div>

            <!-- กล่องข้อมูลรายละเอียด -->
            <div class="bg-white rounded-2xl p-6 text-left space-y-5 mb-8 border border-gray-100 shadow-sm">
                <div class="flex justify-between items-center border-b border-gray-100 pb-4">
                    <span class="font-semibold text-gray-500">ความหมายภาษาไทย:</span>
                    <span id="meaningDisplay" class="text-lg font-bold text-gray-800">-</span>
                </div>
                <div class="flex justify-between items-center border-b border-gray-100 pb-4">
                    <span class="font-semibold text-gray-500">ประเภทคำ:</span>
                    <span id="typeDisplay" class="font-medium text-gray-800">-</span>
                </div>
                <div class="flex justify-between items-center border-b border-gray-100 pb-4">
                    <span class="font-semibold text-gray-500">สถิติการออกข้อสอบ:</span>
                    <span id="freqBadge" class="font-bold text-red-600 bg-red-50 border border-red-100 px-3 py-1 rounded-full text-sm">-</span>
                </div>
                <div class="space-y-2">
                    <span class="font-semibold text-gray-500 block">เลขชุดข้อสอบที่พบซ้ำ:</span>
                    <div id="setsFoundDisplay" class="text-sm font-medium text-gray-700 bg-gray-50 p-3 rounded-xl border border-gray-200">-</div>
                </div>
            </div>

            <!-- ประโยคตัวอย่างจากข้อสอบ (Example) -->
            <div class="bg-yellow-50 border-l-4 border-yellow-400 p-6 rounded-r-xl text-left mb-8 space-y-2">
                <h3 class="text-xs font-bold text-yellow-800 uppercase tracking-wider mb-2">ประโยคตัวอย่างจากข้อสอบ (EXAMPLE)</h3>
                <p id="exampleChinese" class="text-xl font-bold text-gray-900">-</p>
                <p id="examplePinyin" class="text-sm font-semibold text-red-600">-</p>
                <p id="exampleMeaning" class="text-sm font-medium text-gray-700">-</p>
            </div>

            <!-- ปุ่มย้อนกลับ -->
            <a href="hsk5.html" class="inline-block bg-black text-white px-8 py-3 rounded-full font-bold hover:bg-red-600 transition shadow-lg">
                ← กลับสู่หน้าคลังคำศัพท์ HSK 5
            </a>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-black text-white py-6 text-center text-gray-400 text-sm mt-12 border-t-2 border-red-600">
        <p>Fast Learn Academy • เซ็นทรัล โคราช ชั้น 3 Education Zone</p>
    </footer>

    <script>
        // ดึงค่าพารามิเตอร์จาก URL
        const params = new URLSearchParams(window.location.search);
        
        const word = params.get('word') || 'ไม่พบข้อมูล';
        const pinyin = params.get('pinyin') || '-';
        const meaning = params.get('meaning') || '-';
        const type = params.get('type') || '-';
        const setsFound = params.get('setsFound') || '-';
        const example = params.get('example') || 'ไม่มีตัวอย่างประโยคในระบบ';

        document.getElementById('wordDisplay').innerText = word;
        document.getElementById('pinyinDisplay').innerText = pinyin;
        document.getElementById('meaningDisplay').innerText = meaning;
        document.getElementById('typeDisplay').innerText = type;
        document.getElementById('setsFoundDisplay').innerText = setsFound;

        // คำนวณจำนวนชุดข้อสอบที่พบเพื่อแสดงป้ายสถิติ
        const setArray = setsFound ? setsFound.split(',').map(s => s.trim()).filter(s => s) : [];
        const setCount = setArray.length;
        document.getElementById('freqBadge').innerText = setCount > 0 ? `ซ้ำใน ${setCount} ชุดข้อสอบ` : 'พบในข้อสอบ';

        // แสดงตัวอย่างประโยค
        document.getElementById('exampleChinese').innerText = example;
        
        // ฟังก์ชันช่วยจำแนกหรือใส่พินอิน/คำแปลจำลองตามประโยคจริง (ถ้ามี)
        document.getElementById('examplePinyin').innerText = pinyin ? `พินอินคำศัพท์หลัก: ${pinyin}` : '';
        document.getElementById('exampleMeaning').innerText = meaning ? `ความหมายคำศัพท์หลัก: ${meaning}` : '';
    </script>
</body>
</html>
