<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>รายละเอียดคำศัพท์ HSK 5 - Fast Learn Academy</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Prompt', sans-serif; }
    </style>
</head>
<body class="bg-stone-100 text-gray-900 min-h-screen flex flex-col justify-between selection:bg-red-600 selection:text-white">

    <!-- Header Section -->
    <header class="bg-black text-white border-b-4 border-red-600 shadow-lg">
        <div class="max-w-4xl mx-auto px-4 py-8 text-center">
            <div class="inline-block bg-red-600 text-white text-xs font-bold px-3 py-1 rounded-full uppercase tracking-wider mb-2 shadow">
                FAST LEARN ACADEMY
            </div>
            <h1 class="text-2xl md:text-3xl font-extrabold tracking-wide">
                รายละเอียดคำศัพท์ <span class="text-yellow-400">HSK ระดับ 5</span>
            </h1>
        </div>
    </header>

    <!-- Main Content: รายละเอียด (พร้อมปุ่มเลื่อนด้านข้าง) -->
    <main class="max-w-4xl mx-auto px-4 py-12 flex-grow w-full flex items-center justify-center relative">
        
        <!-- ปุ่มย้อนกลับด้านซ้าย -->
        <button onclick="changeWord(-1)" class="absolute left-2 md:left-4 z-10 p-3 md:p-4 bg-white hover:bg-stone-50 text-stone-700 rounded-full shadow-lg border border-stone-200 transition-all hover:scale-105 flex items-center justify-center" title="คำก่อนหน้า">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/></svg>
        </button>

        <!-- การ์ดเนื้อหาตรงกลาง -->
        <div class="w-full max-w-xl bg-white rounded-3xl border-2 border-gray-100 shadow-xl p-8 md:p-12 text-center relative overflow-hidden mx-12">
            <div class="absolute top-0 left-0 w-full h-3 bg-red-600"></div>
            
            <!-- ตัวอักษรจีนหลักและพินอินคำศัพท์ พร้อมปุ่มฟังเสียง -->
            <div id="wordDisplay" class="text-7xl md:text-8xl font-extrabold text-gray-900 mb-2">-</div>
            <div id="pinyinDisplay" class="text-2xl font-bold text-red-600 mb-4">-</div>
            <div class="mb-6">
                <button onclick="speakText(document.getElementById('wordDisplay').innerText)" class="px-4 py-2 bg-red-50 text-red-600 rounded-xl text-xs font-bold hover:bg-red-100 transition shadow-sm">
                    🔊 ฟังเสียงอ่านคำศัพท์
                </button>
            </div>

            <!-- กล่องข้อมูลรายละเอียด -->
            <div class="bg-white rounded-2xl p-6 text-left space-y-4 mb-8 border border-gray-100 shadow-sm">
                <div class="flex justify-between items-center border-b border-gray-100 pb-3">
                    <span class="font-semibold text-gray-500">ความหมายภาษาไทย:</span>
                    <span id="meaningDisplay" class="text-lg font-bold text-gray-800">-</span>
                </div>
                <div class="flex justify-between items-center border-b border-gray-100 pb-3">
                    <span class="font-semibold text-gray-500">ประเภทคำ:</span>
                    <span id="typeDisplay" class="font-medium text-gray-800">-</span>
                </div>
                <div class="flex justify-between items-center border-b border-gray-100 pb-3">
                    <span class="font-semibold text-gray-500">สถิติการออกข้อสอบ:</span>
                    <span id="freqBadge" class="font-bold text-red-600 bg-red-50 border border-red-100 px-3 py-1 rounded-full text-sm">-</span>
                </div>
                <div class="space-y-1">
                    <span class="font-semibold text-gray-500 block">เลขชุดข้อสอบที่พบซ้ำ:</span>
                    <div id="setsFoundDisplay" class="text-sm font-medium text-gray-700 bg-gray-50 p-3 rounded-xl border border-gray-200">-</div>
                </div>
            </div>

            <!-- ประโยคตัวอย่างจากข้อสอบ (Example) พร้อมพินอินและคำแปลไทย และปุ่มฟังเสียง -->
            <div class="bg-yellow-50 border-l-4 border-yellow-400 p-6 rounded-r-xl text-left mb-8 space-y-3">
                <div class="flex justify-between items-center">
                    <h3 class="text-xs font-bold text-yellow-800 uppercase tracking-wider">ประโยคตัวอย่างจากข้อสอบ (EXAMPLE)</h3>
                    <button onclick="speakText(document.getElementById('exampleChinese').innerText)" class="px-3 py-1 bg-yellow-400 text-black text-xs font-bold rounded-lg hover:bg-yellow-500 transition shadow-sm">
                        🔊 ฟังเสียงประโยค
                    </button>
                </div>
                <p id="exampleChinese" class="text-xl font-bold text-gray-900">-</p>
                <p id="examplePinyin" class="text-sm font-semibold text-red-600">-</p>
                <p id="exampleMeaning" class="text-sm font-medium text-gray-700">-</p>
            </div>

            <!-- ปุ่มกลับหน้าหลัก -->
            <div>
                <a href="hsk5.html" class="block w-full bg-black text-white py-3.5 rounded-2xl font-bold hover:bg-zinc-800 transition shadow-lg text-center text-xs">
                    ← กลับสู่หน้าคลังคำศัพท์ HSK 5
                </a>
            </div>
        </div>

        <!-- ปุ่มถัดไปด้านขวา -->
        <button onclick="changeWord(1)" class="absolute right-2 md:right-4 z-10 p-3 md:p-4 bg-white hover:bg-stone-50 text-stone-700 rounded-full shadow-lg border border-stone-200 transition-all hover:scale-105 flex items-center justify-center" title="คำถัดไป">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/></svg>
        </button>

    </main>

    <!-- Footer -->
    <footer class="bg-black text-white py-6 text-center text-gray-400 text-sm mt-12 border-t-2 border-red-600">
        <p>Fast Learn Academy • เซ็นทรัล โคราช ชั้น 3 Education Zone</p>
    </footer>

    <script>
        const hsk5FullData = [
            { id: 1, word: "情绪", pinyin: "qíngxù", meaning: "อารมณ์", type: "คำนาม", setsFound: "H51008, H51327, H51328", chinese: "他的情绪已经稳定下来了。", exPinyin: "Tā de qíngxù yǐjīng wěndìng xiàlái le.", exMeaning: "อารมณ์ของเขาคงที่ลงแล้ว" },
            { id: 2, word: "谨慎", pinyin: "jǐnshèn", meaning: "รอบคอบ", type: "คำคุณศัพท์", setsFound: "H51005, H51007, H51008", chinese: "自己的言行要谨慎。", exPinyin: "Zìjǐ de yánxíng yào jǐnshèn.", exMeaning: "คำพูดและการกระทำของตนเองต้องมีความรอบคอบ" },
            { id: 3, word: "智慧", pinyin: "zhìhuì", meaning: "ปัญญา", type: "คำนาม", setsFound: "H51005, H51007, H51008", chinese: "把沉默是金看做是智慧的表现。", exPinyin: "Bǎ chénmò shì jīn kàn zuò shì zhìhuì de biǎoxiàn.", exMeaning: "มองว่าการนิ่งเสียสลึงทองคำคือการแสดงออกถึงปัญญา" },
            { id: 4, word: "然而", pinyin: "rán'ér", meaning: "แต่ทว่า", type: "คำสันธาน", setsFound: "H51329, H51553B", chinese: "这并不是安全帽使用黄色的唯一理由。", exPinyin: "Zhè bìng bú shì ānquánmào shǐyòng huángsè de wéiyī lǐyóu.", exMeaning: "แต่นี่ไม่ใช่เหตุผลเดียวที่หมวกนิรภัยใช้สีเหลือง" },
            { id: 5, word: "作为", pinyin: "zuòwéi", meaning: "ในฐานะที่เป็น", type: "กริยา/บุพบท", setsFound: "H51329, H51553B", chinese: "炎炎烈日下，黄色安全帽可以使工人的头部免受阳光。", exPinyin: "Yányán lièrì xià, huángsè ānquánmào kěyǐ shǐ gōngrén de tóubù miǎn shòu yángguāng.", exMeaning: "ในฐานะที่อยู่ภายใต้แสงแดดแผดเผา หมวกนิรภัยสีเหลืองช่วยป้องกันศีรษะคนงานจากแสงแดด" },
            { id: 6, word: "由于", pinyin: "yóuyú", meaning: "เนื่องจาก", type: "คำบุพบท/สันธาน", setsFound: "H51329, H51553B", chinese: "为了安全起见，工人们通常戴黄色安全帽。", exPinyin: "Wèile ānquán qǐjiàn, gōngrénmen tōngcháng dài huángsè ānquánmào.", exMeaning: "เนื่องจากคำนึงถึงความปลอดภัย คนงานมักจะสวมหมวกนิรภัยสีเหลือง" },
            { id: 7, word: "往往", pinyin: "wǎngwǎng", meaning: "บ่อยๆ / มักจะ", type: "คำวิเศษณ์", setsFound: "H51329, H51553B", chinese: "往往能引起人们的注意。", exPinyin: "Wǎngwǎng néng yǐnqǐ rénmen de zhùyì.", exMeaning: "มักจะสามารถดึงดูดความสนใจของผู้คนได้" },
            { id: 8, word: "而且", pinyin: "érqiě", meaning: "อีกทั้ง / และ", type: "คำสันธาน", setsFound: "H51329, H51553B", chinese: "不仅好看，而且实用。", exPinyin: "Bùjǐn hǎokàn, érqiě shíyòng.", exMeaning: "ไม่เพียงแต่ดูดีเท่านั้น แต่อีกทั้งยังใช้งานได้จริงด้วย" },
            { id: 9, word: "甚至", pinyin: "shènzhì", meaning: "แม้กระทั่ง / ถึงขนาด", type: "คำวิเศษณ์/สันธาน", setsFound: "H51329, H51553B", chinese: "甚至有些出乎意料。", exPinyin: "Shènzhì yǒuxiē chūhū yìliào.", exMeaning: "แม้กระทั่งมีความคาดไม่ถึงอยู่บ้าง" },
            { id: 10, word: "根据", pinyin: "gēnjù", meaning: "ตาม / อิงตาม", type: "คำบุพบท/คำนาม", setsFound: "H51329, H51553B", chinese: "根据相关规定。", exPinyin: "Gēnjù xiāngguān guīdìng.", exMeaning: "ตามข้อกำหนดที่เกี่ยวข้อง" }
        ];

        function speakText(text) {
            if ('speechSynthesis' in window) {
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'zh-CN';
                utterance.rate = 0.9;
                window.speechSynthesis.speak(utterance);
            } else {
                alert("เบราว์เซอร์ของคุณไม่รองรับการออกเสียง");
            }
        }

        const urlParams = new URLSearchParams(window.location.search);
        let currentWordIndex = 0;

        const targetWord = urlParams.get('word');
        if (targetWord) {
            const foundIdx = hsk5FullData.findIndex(item => item.word === targetWord);
            if (foundIdx !== -1) currentWordIndex = foundIdx;
        } else {
            // หากไม่มีพารามิเตอร์ส่งมา ให้ดึงจาก URL ตรงๆ ได้เช่นกัน
            hsk5FullData[0] = {
                id: 1,
                word: urlParams.get('word') || '情绪',
                pinyin: urlParams.get('pinyin') || 'qíngxù',
                meaning: urlParams.get('meaning') || 'อารมณ์',
                type: urlParams.get('type') || 'คำนาม',
                setsFound: urlParams.get('setsFound') || 'H51008',
                chinese: urlParams.get('chinese') || '他的情绪已经稳定下来了。',
                exPinyin: urlParams.get('exPinyin') || 'Tā de qíngxù yǐjīng wěndìng xiàlái le.',
                exMeaning: urlParams.get('exMeaning') || 'อารมณ์ของเขาคงที่ลงแล้ว'
            };
        }

        function displayCurrentWord() {
            const item = hsk5FullData[currentWordIndex];
            document.getElementById('wordDisplay').innerText = item.word;
            document.getElementById('pinyinDisplay').innerText = item.pinyin;
            document.getElementById('meaningDisplay').innerText = item.meaning;
            document.getElementById('typeDisplay').innerText = item.type;
            
            const setArray = item.setsFound ? item.setsFound.split(',').map(s => s.trim()).filter(s => s) : [];
            const setCount = setArray.length;
            document.getElementById('freqBadge').innerText = setCount > 0 ? `ซ้ำใน ${setCount} ชุดข้อสอบ` : 'พบในข้อสอบ';
            document.getElementById('setsFoundDisplay').innerText = item.setsFound || '-';
            
            document.getElementById('exampleChinese').innerText = item.chinese || '暂ไม่มีตัวอย่างประโยคในระบบ';
            document.getElementById('examplePinyin').innerText = item.exPinyin ? `พินอิน: ${item.exPinyin}` : '';
            document.getElementById('exampleMeaning').innerText = item.exMeaning ? `แปลไทย: ${item.exMeaning}` : '';
        }

        function changeWord(direction) {
            currentWordIndex += direction;
            if (currentWordIndex < 0) {
                currentWordIndex = hsk5FullData.length - 1;
            } else if (currentWordIndex >= hsk5FullData.length) {
                currentWordIndex = 0;
            }
            displayCurrentWord();
        }

        displayCurrentWord();
    </script>
</body>
</html>
