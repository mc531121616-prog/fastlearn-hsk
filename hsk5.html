            { id: 49, word: "可是", pinyin: "kěshì", meaning: "แต่", type: "คำสันธาน", setsFound: "H51005", chinese: "可是他的话让我改变了主意。", exPinyin: "Kěshì tā de huà ràng wǒ gǎibiàn le zhǔyi.", exMeaning: "แต่คำพูดของเขาทำให้ฉันเปลี่ยนความคิด" },
            { id: 50, word: "食品", pinyin: "shípǐn", meaning: "อาหาร", type: "คำนาม", setsFound: "H51005", chinese: "食品安全。", exPinyin: "Shípǐn ānquán.", exMeaning: "ความปลอดภัยด้านอาหาร" },
            { id: 51, word: "酒吧", pinyin: "jiǔbā", meaning: "บาร์ / ผับ", type: "คำนาม", setsFound: "H51005", chinese: "在酒吧经营。", exPinyin: "Zài jiǔbā jīngyíng.", exMeaning: "ทำธุรกิจอยู่ในบาร์ / ผับ" },
            { id: 52, word: "删除", pinyin: "shānchú", meaning: "ลบ (ข้อมูล)", type: "คำกริยา", setsFound: "H51005", chinese: "删除了文件。", exPinyin: "Shānchú le wénjiàn.", exMeaning: "ลบไฟล์ข้อมูลเรียบร้อยแล้ว" },
            { id: 53, word: "角度", pinyin: "jiāodù", meaning: "มุมมอง", type: "คำนาม", setsFound: "H51005", chinese: "从不同的角度观察事物。", exPinyin: "Cóng bùtóng de jiǎodù guānchá shìwù.", exMeaning: "สังเกตสิ่งต่างๆ จากมุมมองที่แตกต่างกัน" },

        // เติมข้อมูลจำลองให้ครบ 179 คำ
        for(let i=56; i<=179; i++) {
            hsk5Data.push({
                id: i,
                word: `高级词${i}`,
                pinyin: `gāojí cí ${i}`,
                meaning: `คำศัพท์ระดับสูง HSK5 ลำดับที่ ${i}`,
                type: "คำนาม/คำคุณศัพท์",
                setsFound: "H51005, H51008",
                chinese: `这是第${i}个HSK5级高级词汇的标准考试真题例句，考核高级语言运用能力。`,
                exPinyin: `Zhè shì dì ${i} gè HSK wǔ jí gāojí cíhuì de biāozhǔn kǎoshì zhēntí lìjù, kǎohé gāojí yǔyán yùnyòng nénglì.`,
                exMeaning: `นี่คือตัวอย่างประโยคข้อสอบจริงมาตรฐานของคำศัพท์ระดับสูง HSK ระดับ 5 ลำดับที่ ${i} เพื่อทดสอบความสามารถในการใช้ภาษาขั้นสูง`
            });
        }

        const grid = document.getElementById('vocabGrid');

        function renderVocab(data) {
            grid.innerHTML = '';
            data.forEach((item) => {
                const card = document.createElement('div');
                card.className = "bg-white p-6 rounded-2xl border-2 border-gray-100 shadow-md hover:border-red-500 hover:shadow-xl transition-all duration-300 flex flex-col justify-between cursor-pointer group";
                
                const setArray = item.setsFound ? item.setsFound.split(',').filter(s => s.trim()) : [];
                const setCount = setArray.length;
                const freqText = setCount > 0 ? `ซ้ำใน ${setCount} ชุดข้อสอบ` : 'พบในข้อสอบ';

                card.onclick = () => {
                    window.location.href = `hsk5-detail.html?word=${encodeURIComponent(item.word)}&pinyin=${encodeURIComponent(item.pinyin)}&meaning=${encodeURIComponent(item.meaning)}&type=${encodeURIComponent(item.type)}&setsFound=${encodeURIComponent(item.setsFound)}&chinese=${encodeURIComponent(item.chinese)}&exPinyin=${encodeURIComponent(item.exPinyin)}&exMeaning=${encodeURIComponent(item.exMeaning)}`;
                };

                card.innerHTML = `
                    <div>
                        <div class="flex justify-between items-center mb-3">
                            <span class="text-xs font-bold px-3 py-1 bg-red-100 text-red-700 rounded-full">${item.type}</span>
                            <span class="text-xs font-bold px-3 py-1 bg-yellow-100 text-yellow-800 rounded-full">${freqText}</span>
                        </div>
                        <div class="text-4xl font-extrabold text-gray-800 group-hover:text-red-600 transition-colors mb-1">${item.word}</div>
                        <div class="text-lg font-semibold text-red-600 mb-2">${item.pinyin}</div>
                        <p class="text-gray-600 text-sm line-clamp-1">${item.meaning}</p>
                    </div>
                    <div class="mt-4 pt-3 border-t border-gray-100 text-xs text-gray-400 group-hover:text-red-600 font-bold flex items-center justify-between transition-colors">
                        <span>ดูชุดข้อสอบและตัวอย่างประโยค</span>
                        <span>→</span>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function filterVocab() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = hsk5Data.filter(item => 
                item.word.toLowerCase().includes(query) || 
                item.pinyin.toLowerCase().includes(query) || 
                item.meaning.toLowerCase().includes(query)
            );
            renderVocab(filtered);
        }

        renderVocab(hsk5Data);
    </script>
