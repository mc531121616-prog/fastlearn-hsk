        const grid = document.getElementById('vocabGrid');

        function renderVocab(data) {
            grid.innerHTML = '';
            data.forEach((item) => {
                const card = document.createElement('div');
                card.className = "bg-white p-6 rounded-2xl border-2 border-gray-100 shadow-md hover:border-red-500 hover:shadow-xl transition-all duration-300 flex flex-col justify-between cursor-pointer group";
                
                card.onclick = () => {
                    window.location.href = `hsk5-detail.html?word=${encodeURIComponent(item.word)}&pinyin=${encodeURIComponent(item.pinyin)}&meaning=${encodeURIComponent(item.meaning)}&type=${encodeURIComponent(item.type)}&setsFound=${encodeURIComponent(item.setsFound)}&example=${encodeURIComponent(item.example)}`;
                };

                card.innerHTML = `
                    <div>
                        <div class="flex justify-between items-center mb-3">
                            <span class="text-xs font-bold px-3 py-1 bg-red-100 text-red-700 rounded-full">${item.type}</span>
                            <span class="text-xs font-bold px-3 py-1 bg-yellow-100 text-yellow-800 rounded-full">HSK 5</span>
                        </div>
                        <div class="text-4xl font-extrabold text-gray-800 group-hover:text-red-600 transition-colors mb-1">${item.word}</div>
                        <div class="text-lg font-semibold text-red-600 mb-2">${item.pinyin}</div>
                        <p class="text-gray-600 text-sm line-clamp-1">${item.meaning}</p>
                    </div>
                    <div class="mt-4 pt-3 border-t border-gray-100 text-xs text-gray-400 group-hover:text-red-600 font-bold flex items-center justify-between transition-colors">
                        <span>ดูชุดข้อสอบและตัวอย่างประโยค</span>
                        <span>→</span>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function filterVocab() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = hsk5Data.filter(item => 
                item.word.toLowerCase().includes(query) || 
                item.pinyin.toLowerCase().includes(query) || 
                item.meaning.toLowerCase().includes(query)
            );
            renderVocab(filtered);
        }
